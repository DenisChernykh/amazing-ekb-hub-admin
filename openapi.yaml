# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2021-09-28
openapi: 3.0.3
info:
  title: Amazing EKB Hub API
  version: 1.0.0
  description: MVP backend API (OpenAPI-first)
servers:
  - url: /v1
tags:
  - name: Auth
    description: Аутентификация пользователя, refresh токенов и получение текущего профиля.
  - name: Places
    description: Публичные эндпоинты каталога мест и связанных с ними материалов.
  - name: Favorites
    description: Работа с избранными местами текущего пользователя.
  - name: Admin
    description: Административные операции управления местами и материалами.
  - name: Health
    description: Служебные эндпоинты liveness/readiness для мониторинга и orchestration.

components:
  securitySchemes:
    AccessCookieAuth:
      type: apiKey
      in: cookie
      name: aeh_access_token
      description: |
        HttpOnly cookie с JWT access token. Клиент должен отправлять запросы с credentials.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: aeh_refresh_token
      description: |
        HttpOnly cookie с refresh token для `/auth/refresh` и `/auth/logout`.

  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      description: Идентификатор места.
      schema:
        type: string
      example: place_ekb_001

    PlaceSlug:
      name: placeSlug
      in: path
      required: true
      description: Публичный slug места.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: baden-baden-uktus

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Идентификатор категории места.
      schema:
        type: string
      example: category_spa

    CategorySlug:
      name: categorySlug
      in: path
      required: true
      description: Публичный slug категории места.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: spa

    MaterialId:
      name: materialId
      in: path
      required: true
      description: Идентификатор материала.
      schema:
        type: string
      example: material_telegram_001

    ContentSourceId:
      name: sourceId
      in: path
      required: true
      description: Идентификатор content source.
      schema:
        type: string
      example: source_telegram_001

    PlaceImportOperationId:
      name: operationId
      in: path
      required: true
      description: Идентификатор операции автоматического создания места.
      schema:
        type: string
      example: cmrvo_place_import_001

    Page:
      name: page
      in: query
      required: false
      description: Номер страницы пагинации. Допустимый диапазон от `1` до `1000`.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
      example: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Размер страницы. Допустимый диапазон от `1` до `100`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  examples:
    AuthLoginRequest:
      summary: Вход по email и паролю
      value:
        email: admin@example.test
        password: replace_me_password

    AuthMeResponse:
      summary: Профиль текущего пользователя
      value:
        id: user_admin_001
        email: admin@example.test
        role: admin

