      value:
        statusCode: 401
        message: Authentication required
        error: Unauthorized

    ForbiddenError:
      summary: Недостаточно прав
      value:
        statusCode: 403
        message: Insufficient role
        error: Forbidden

    TooManyRequestsError:
      summary: Слишком много auth-запросов
      value:
        statusCode: 429
        message: Too many auth attempts, please retry later

    PlaceNotFoundError:
      summary: Место не найдено
      value:
        statusCode: 404
        message: Place not found
        error: Not Found

    CategoryNotFoundError:
      summary: Категория не найдена
      value:
        statusCode: 404
        message: Category not found
        error: Not Found

    CategoryConflictError:
      summary: Категория уже существует
      value:
        statusCode: 409
        message: Category with this slug already exists
        error: Conflict

    CategoryInUseError:
      summary: Категория используется местами
      value:
        statusCode: 409
        message: Category is used by places
        error: Conflict

    MaterialNotFoundError:
      summary: Материал не найден
      value:
        statusCode: 404
        message: Material not found
        error: Not Found

    ContentSourceNotFoundError:
      summary: Content source не найден
      value:
        statusCode: 404
        message: Content source not found
        error: Not Found

    ContentSourceConflictError:
      summary: Content source уже существует
      value:
        statusCode: 409
        message: Content source already exists for this platform and URL
        error: Conflict

    ContentSourceIdentityLockedError:
      summary: Identity content source уже использовался для импортов
      value:
        statusCode: 409
        message: Content source identity cannot be changed after imports have started
        error: Conflict

    TelegramImportAlreadyRunningError:
      summary: Telegram import уже выполняется
      value:
        statusCode: 409
        message: Telegram import is already running for this content source
        error: Conflict

    PinnedMaterialBadRequestError:
      summary: Материал не принадлежит месту
      value:
        statusCode: 400
        message: Pinned material must belong to the same place
        error: Bad Request

    ServiceUnavailableError:
      summary: Сервис временно не готов
      value:
        statusCode: 503
        message: Database is not ready
        error: Service Unavailable

    HealthLiveResponse:
      summary: Приложение живо
      value:
        status: ok

    HealthReadyResponse:
      summary: Приложение готово обслуживать запросы
      value:
        status: ok
        checks:
          database: up

  responses:
    ValidationError:
      description: Ошибка валидации входных параметров или тела запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ValidationError'

    Unauthorized:
      description: Пользователь не аутентифицирован или auth cookie отсутствует/некорректна.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/UnauthorizedError'

    Forbidden:
      description: У текущего пользователя недостаточно прав для выполнения операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ForbiddenError'

    TooManyRequests:
      description: Слишком много auth-запросов за короткий промежуток времени.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/TooManyRequestsError'

    PlaceNotFound:
      description: Указанное место не найдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/PlaceNotFoundError'

    CategoryNotFound:
      description: Указанная категория не найдена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/CategoryNotFoundError'

    CategoryConflict:
      description: Категория конфликтует с существующей записью или используется местами.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            duplicate:
              $ref: '#/components/examples/CategoryConflictError'
            inUse:
              $ref: '#/components/examples/CategoryInUseError'

    MaterialNotFound:
      description: Указанный материал не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/MaterialNotFoundError'

    ContentSourceNotFound:
      description: Указанный content source не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ContentSourceNotFoundError'

    ContentSourceConflict:
      description: Content source с такой platform/url уже существует или identity source уже нельзя менять после старта импортов.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            duplicate:
              $ref: '#/components/examples/ContentSourceConflictError'
            identityLocked:
              $ref: '#/components/examples/ContentSourceIdentityLockedError'

    TelegramImportAlreadyRunning:
      description: Для этого content source уже есть active queued/running Telegram import run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/TelegramImportAlreadyRunningError'

    ServiceUnavailable:
      description: Сервис временно не готов обрабатывать запросы.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ServiceUnavailableError'

  schemas:
    Role:
      type: string
      description: Роль пользователя в системе.
      enum: [admin, user]
      example: admin

    PlaceCategory:
      type: object
      description: Публичная категория места для фильтров.
      required: [id, slug, title, coverImageUrl]
      properties:
        id:
          type: string
          description: Идентификатор категории.
          example: category_spa
        slug:
          type: string
          description: Человекочитаемый slug категории.
          example: spa
        title:
          type: string
          description: Название категории для интерфейса.
          example: SPA
        coverImageUrl:
          type: string
          nullable: true
          description: Versioned URL cover-фотографии категории или `null`, если фото отсутствует.
          example: /v1/categories/spa/photo?v=23b991827df4

    AdminPlaceCategory:
      allOf:
        - $ref: '#/components/schemas/PlaceCategory'
        - type: object
          description: Административная категория места с системными датами.
          required: [status, createdAt, updatedAt]
          properties:
            status:
              type: string
              enum: [draft, active]
              description: Draft-категория скрыта из public API до публикации первого места.
              example: active
            createdAt:
              type: string
              format: date-time
              description: Время создания категории.
              example: '2026-07-03T10:00:00.000Z'
            updatedAt:
              type: string
              format: date-time
              description: Время последнего обновления категории.
              example: '2026-07-03T10:00:00.000Z'

    PlaceCategoryListResponse:
      type: object
      description: Публичный список категорий мест.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceCategory'

    AdminPlaceCategoryListResponse:
      type: object
      description: Административный список категорий мест.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPlaceCategory'

    PlaceStatus:
      type: string
      description: Статус публикации места.
      enum: [active, hidden]
      example: active

    Platform:
      type: string
      description: Платформа, на которой опубликован материал.
      enum: [dzen, telegram, instagram]
      example: telegram

    MaterialType:
      type: string
      description: Тип материала.
      enum: [post, reel, video]
      example: post

    MaterialAdminStatus:
      type: string
      description: Review-статус материала в административной библиотеке.
      enum: [pending, approved, rejected, archived]
      example: approved

    PlaceMaterialLinkStatus:
      type: string
      description: Статус связи библиотечного материала с конкретным местом.
      enum: [active, hidden]
      example: active

    ContentSourcePlatform:
      type: string
      description: Платформа пользовательского источника контента. Этот enum отделен от material `Platform`, чтобы будущие источники не меняли публичные счетчики материалов.
      enum: [telegram, dzen, instagram, tiktok, vk, pinterest]
      example: telegram

    ContentSourceStatus:
      type: string
      description: Статус пользовательского content source.
      enum: [active, disabled]
      example: active

    ImportRunStatus:
      type: string
      description: Статус попытки импорта материалов.
      enum: [queued, running, completed, failed]
      example: completed

    NestErrorResponse:
      type: object
      description: Стандартный JSON body, который NestJS возвращает для `HttpException`.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          description: HTTP status code ответа.
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Сообщение ошибки. Для DTO validation NestJS обычно возвращает массив строк.
          example: Bad Request
        error:
          type: string
          description: Стандартное HTTP reason summary от NestJS.
          example: Bad Request

    AuthLoginRequest:
      type: object
      description: Данные для входа пользователя по email и паролю.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email пользователя.
          example: admin@example.test
        password:
          type: string
          description: Пароль пользователя. Login не раскрывает password policy и возвращает generic credentials error для неверного пароля любой длины.
          example: replace_me_password

    AuthMeResponse:
      type: object
      description: Публичный профиль текущего пользователя.
      required: [id, email, role]
      properties:
        id:
          type: string
          description: Идентификатор пользователя.
          example: user_admin_001
        email:
          type: string
          format: email
          description: Email пользователя.
          example: admin@example.test
        role:
          $ref: '#/components/schemas/Role'

    PlaceSummary:
      type: object
      description: Краткая карточка места, используемая в списках.
      required:
        [id, slug, title, summary, tags, category, status, coverImageUrl]
      properties:
        id:
          type: string
          description: Идентификатор места.
          example: place_ekb_001
        slug:
          type: string
          description: Публичный slug места.
          example: baden-baden-uktus
        title:
          type: string
          description: Название места.
          example: Bаден-Баден Уктус
        summary:
          type: string
          description: Короткое описание для каталога.
          example: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          type: array
          description: Набор тегов для поиска и фильтрации.
          items:
            type: string
          example:
            - термы
            - spa
            - бассейн
        category:
          $ref: '#/components/schemas/PlaceCategory'
        status:
          $ref: '#/components/schemas/PlaceStatus'
        coverImageUrl:
          type: string
          nullable: true
          description: Публичный cover-фото места. Если фото отсутствует или не должно отдаться публично, возвращается `null`.
          example: /v1/places/baden-baden-uktus/photo

    AdminPlaceSummary:
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          required: [mapsUrl]
          properties:
            mapsUrl:
              type: string
              format: uri
              nullable: true
              description: Canonical Yandex Maps URL импортированного места; `null` для мест без такой external reference.
              example: https://yandex.ru/maps/org/baden_baden/123456789

    PublicPlaceSummary:
      type: object
      description: Краткая публичная карточка места со счетчиками материалов по платформам.
      required:
        [
          id,
          slug,
          title,
          summary,
          tags,
          category,
          status,
          coverImageUrl,
          counters,
        ]
      properties:
        id:
          type: string
          description: Идентификатор места.
          example: place_ekb_001
        slug:
          type: string
          description: Публичный slug места.
          example: baden-baden-uktus
        title:
          type: string
          description: Название места.
          example: Bаден-Баден Уктус
        summary:
          type: string
          description: Короткое описание для каталога.
          example: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          type: array
          description: Набор тегов для поиска и фильтрации.
          items:
            type: string
          example:
            - термы
            - spa
            - бассейн
        category:
          $ref: '#/components/schemas/PlaceCategory'
        status:
          $ref: '#/components/schemas/PlaceStatus'
        coverImageUrl:
          type: string
          nullable: true
          description: Публичный cover-фото места. Если фото отсутствует или не должно отдаться публично, возвращается `null`.
          example: /v1/places/baden-baden-uktus/photo
        counters:
          type: object
          description: Количество материалов по платформам.
          required: [dzen, telegram, instagram]
          properties:
            dzen:
              type: integer
              example: 12
            telegram:
              type: integer
              example: 7
            instagram:
              type: integer
              example: 3

    Material:
      type: object
      description: Административный материал, связанный с местом. Содержит исходную внешнюю ссылку для внутренних сценариев управления.
      required:
        [id, placeId, platform, type, title, publishedAt, url, durationSec]
      properties:
        id:
          type: string
          description: Идентификатор материала.
          example: material_telegram_001
        placeId:
          type: string
          description: Идентификатор места, к которому относится материал.
          example: place_ekb_001
        platform:
          $ref: '#/components/schemas/Platform'
        type:
          $ref: '#/components/schemas/MaterialType'
        title:
          type: string
          nullable: true
          description: Заголовок материала. Для импортированных материалов может быть `null`, если источник не дает надежный ручной title.
          example: null
        publishedAt:
          type: string
          format: date
          description: Календарная дата публикации материала в формате `YYYY-MM-DD`.
          example: '2026-03-20'
        durationSec:
          type: integer
          nullable: true
          description: Длительность в секундах для видеоформатов.
          example: 183
        url:
          type: string
          format: uri
          description: Исходная внешняя ссылка на материал. Допускаются только абсолютные http/https URL.
          example: https://t.me/amazing_ekb/321

    PublicMaterial:
      type: object
      description: Публичный материал, связанный с местом. Исходный внешний URL не отдается; публичные клиенты должны использовать `redirectUrl`.
      required:
        [
          id,
          placeId,
          platform,
          type,
          title,
          publishedAt,
          durationSec,
          redirectUrl,
        ]
      properties:
        id:
          type: string
          description: Идентификатор материала.
          example: material_telegram_001
        placeId:
          type: string
          description: Идентификатор места, к которому относится материал.
          example: place_ekb_001
        platform:
          $ref: '#/components/schemas/Platform'
        type:
          $ref: '#/components/schemas/MaterialType'
        title:
          type: string
          nullable: true
          description: Заголовок материала. Для импортированных материалов может быть `null`, если источник не дает надежный ручной title.
          example: null
        publishedAt:
          type: string
          format: date
          description: Календарная дата публикации материала в формате `YYYY-MM-DD`.
          example: '2026-03-20'
        durationSec:
          type: integer
          nullable: true
          description: Длительность в секундах для видеоформатов.
          example: 183
        redirectUrl:
          type: string
          nullable: true
          description: Same-origin redirect URL для публичного открытия материала без прямого внешнего href. Поле заполняется только для публично безопасных target URL.
          example: /v1/materials/material_telegram_001/go

    MaterialContentSourceSummary:
      type: object
      description: Краткое представление content source для imported material.
      required: [id, platform, displayName, url]
      properties:
        id:
          type: string
          description: Идентификатор content source.
          example: source_telegram_001
        platform:
          $ref: '#/components/schemas/ContentSourcePlatform'
        displayName:
          type: string
          description: Административное имя source.
          example: Amazing EKB Telegram
        url:
          type: string
          format: uri
          description: URL source.
          example: https://t.me/amazing_ekb

    AdminMaterialLibraryItem:
      type: object
      description: Материал из общей библиотеки для административного интерфейса.
      required:
        [
          id,
          platform,
          type,
          title,
          publishedAt,
          durationSec,
          url,
          source,
          externalId,
          text,
          excerpt,
          mediaKind,
          mediaPreviewUrl,
          adminStatus,
          linked,
          placeLink,
        ]
      properties:
        id:
          type: string
          description: Идентификатор материала.
          example: material_telegram_001
        platform:
          $ref: '#/components/schemas/Platform'
        type:
          $ref: '#/components/schemas/MaterialType'
        title:
          type: string
          nullable: true
          description: Заголовок материала. Для импортированных материалов может быть `null`.
          example: null
        publishedAt:
          type: string
          format: date
          description: Календарная дата публикации материала в формате `YYYY-MM-DD`.
          example: '2026-03-20'
        durationSec:
          type: integer
          nullable: true
          description: Длительность в секундах для видеоформатов.
          example: 183
        url:
          type: string
          format: uri
          description: Публичная ссылка на материал.
          example: https://t.me/amazing_ekb/321
        source:
          nullable: true
          description: Content source, из которого импортирован материал. Для manual materials возвращается `null`.
          oneOf:
            - $ref: '#/components/schemas/MaterialContentSourceSummary'
        externalId:
          type: string
          nullable: true
          description: Платформенный id материала внутри source, например Telegram message id.
          example: '321'
        text:
          type: string
          nullable: true
          description: Полный текст импортированного материала, если он есть.
          example: 'Пост из Telegram-канала Amazing EKB'
        excerpt:
          type: string
          nullable: true
          description: Короткий текстовый preview для админского списка.
          example: 'Пост из Telegram-канала Amazing EKB'
        mediaKind:
          type: string
          nullable: true
          description: Нормализованный тип media из импортера без скачивания бинарных файлов.
          example: photo
        mediaPreviewUrl:
          type: string
          format: uri
          nullable: true
          description: URL preview media, если адаптер смог безопасно его получить.
          example: null
        adminStatus:
          $ref: '#/components/schemas/MaterialAdminStatus'
        linked:
          type: boolean
          description: Есть ли у материала хотя бы одна связь `PlaceMaterial` с любым местом, включая hidden-связи.
          example: false
        placeLink:
          nullable: true
          description: Статус связи с `placeId` из query. Если `placeId` не передан или связи нет, возвращается `null`.
          oneOf:
            - $ref: '#/components/schemas/PlaceMaterialLinkStatus'

    AdminMaterialLibraryListResponse:
      type: object
      description: Пагинированный административный список материалов общей библиотеки.
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          description: Материалы библиотеки на текущей странице.
          items:
            $ref: '#/components/schemas/AdminMaterialLibraryItem'
        total:
          type: integer
          description: Общее количество материалов, подходящих под фильтры.
          example: 42
        page:
          type: integer
          description: Текущая страница.
          example: 1
        pageSize:
          type: integer
          description: Размер страницы.
          example: 100

    ContentSource:
      type: object
      description: 'Пользовательский управляемый источник контента: Telegram-канал, Dzen-канал/профиль или будущий platform resource.'
      required:
        [
          id,
          platform,
          displayName,
          url,
          externalId,
          handle,
          channelId,
          status,
          lastImportedAt,
          lastCursor,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          description: Идентификатор content source.
          example: source_telegram_001
        platform:
          $ref: '#/components/schemas/ContentSourcePlatform'
        displayName:
          type: string
          description: Административное имя источника, отдельное от заголовков материалов.
          example: Amazing EKB Telegram
        url:
          type: string
          format: uri
          description: Публичный URL управляемого источника. Допускаются только абсолютные http/https URL.
          example: https://t.me/amazing_ekb
        externalId:
          type: string
          nullable: true
          description: Платформенный идентификатор источника, если известен.
          example: '123456'
        handle:
          type: string
          nullable: true
          description: Человекочитаемый handle источника, если он есть.
          example: amazing_ekb
        channelId:
          type: string
          nullable: true
          description: Дополнительный channel id для платформ, где он отличается от externalId/handle.
          example: null
        status:
          $ref: '#/components/schemas/ContentSourceStatus'
        lastImportedAt:
          type: string
          format: date-time
          nullable: true
          description: Время последнего успешного import batch.
          example: null
        lastCursor:
          type: string
          nullable: true
          description: JSON cursor последнего Telegram import batch или cursor будущего платформенного импортера.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Время создания записи.
          example: '2026-05-20T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления записи.
          example: '2026-05-20T10:00:00.000Z'

    ContentSourceListResponse:
      type: object
      description: Ограниченный административный список пользовательских content sources.
      required: [items]
      properties:
        items:
          type: array
          description: Content sources в стабильном порядке.
          items:
            $ref: '#/components/schemas/ContentSource'

    ImportRun:
      type: object
      description: Диагностическая запись одной попытки импорта материалов.
      required:
        [
          id,
          sourceId,
          status,
          startedAt,
          finishedAt,
          foundCount,
          createdCount,
          updatedCount,
          skippedDuplicateCount,
          errorMessage,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          description: Идентификатор import run.
          example: import_run_001
        sourceId:
          type: string
          description: Идентификатор content source, для которого выполнялся импорт.
          example: source_telegram_001
        status:
          $ref: '#/components/schemas/ImportRunStatus'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Время начала фактической обработки. Для queued run может быть `null`.
          example: '2026-05-26T05:00:00.000Z'
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Время завершения успешной или failed попытки.
          example: '2026-05-26T05:01:00.000Z'
        foundCount:
          type: integer
          minimum: 0
          description: Сколько материалов адаптер обнаружил во внешнем источнике.
          example: 7
        createdCount:
          type: integer
          minimum: 0
          description: Сколько новых материалов создано в библиотеке.
          example: 2
        updatedCount:
          type: integer
          minimum: 0
          description: Сколько существующих материалов обновлено.
          example: 4
        skippedDuplicateCount:
          type: integer
          minimum: 0
          description: Сколько найденных материалов пропущено как дубликаты.
          example: 1
        errorMessage:
          type: string
          nullable: true
          description: Безопасная однострочная диагностика failed run без stack trace и secret-значений.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Время создания записи.
          example: '2026-05-26T05:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления записи.
          example: '2026-05-26T05:01:00.000Z'

    ImportRunListResponse:
      type: object
      description: Ограниченный административный список попыток импорта.
      required: [items]
      properties:
        items:
          type: array
          description: Import runs в порядке от новых к старым.
          items:
            $ref: '#/components/schemas/ImportRun'

