      description: Загружает или заменяет cover-фотографию категории. Принимаются JPEG, PNG и WebP размером не более 5 MB.
      operationId: uploadPlaceCategoryPhoto
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG, PNG или WebP файл размером не более 5 MB.
      responses:
        '200':
          description: Фотография загружена, category metadata и versioned URL обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaceCategory'
              examples:
                default:
                  $ref: '#/components/examples/AdminPlaceCategory'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'

  /admin/place-imports/yandex-maps:
    post:
      tags: [Admin]
      summary: Start Yandex Maps place import
      description: |
        Создает durable queued operation для одной карточки организации. URL проверяется и очищается до persistence. Endpoint требует trusted Origin/Referer; feature по умолчанию выключена.
      operationId: startYandexMapsPlaceImport
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPlaceImportRequest'
      responses:
        '202':
          description: Operation committed; delivery может быть повторена dispatcher-ом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceImportOperation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: У администратора уже есть активная operation.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/place-imports/{operationId}:
    get:
      tags: [Admin]
      summary: Get place import operation
      operationId: getPlaceImportOperation
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
      responses:
        '200':
          description: Текущий source-of-truth snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceImportOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Operation не найдена или принадлежит другому пользователю.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/place-imports/{operationId}/events:
    get:
      tags: [Admin]
      summary: Read place import journal
      description: Polling fallback и reconnect delta после известной operation version.
      operationId: readPlaceImportEvents
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
        - name: afterVersion
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Snapshot и append-only journal delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceImportEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Operation не найдена.

  /admin/place-imports/{operationId}/events/stream:
    get:
      tags: [Admin]
      summary: Stream place import updates
      description: |
        SSE `place-import.updated` использует subscribe → read → read handshake, Redis version hints и периодическое PostgreSQL reconciliation. Terminal status закрывает stream.
      operationId: streamPlaceImportEvents
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
        - name: afterVersion
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: SSE stream; `data` соответствует PlaceImportEventsResponse.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 3
                event: place-import.updated
                data: {"operation":{"id":"cmrvo_place_import_001","status":"preview_ready","version":3},"events":[]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/place-imports/{operationId}/confirm:
    post:
      tags: [Admin]
      summary: Confirm immutable place import preview
      description: Без request body атомарно создает hidden Place, external reference и при необходимости draft-категорию. Требует trusted Origin/Referer.
      operationId: confirmPlaceImport
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
      responses:
        '201':
          description: Создано hidden место либо возвращено строго существующее.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceImportOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Operation не найдена.
        '409':
          description: Preview не готов или обнаружен external identity conflict.
        '410':
          description: Preview TTL истёк.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/place-imports/{operationId}/cancel:
    post:
      tags: [Admin]
      summary: Cancel place import
      description: Durable cancellation; Redis notification является только latency hint. Требует trusted Origin/Referer.
      operationId: cancelPlaceImport
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
      responses:
        '201':
          description: Cancelled или ранее terminal snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceImportOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Operation не найдена.

  /admin/place-imports/{operationId}/viewer-access:
    post:
      tags: [Admin]
      summary: Create one-time CAPTCHA viewer access
      description: Выдает один capability во fragment отдельного viewer-origin. Повторная выдача блокируется до revoke/expiry.
      operationId: createPlaceImportViewerAccess
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
      responses:
        '201':
          description: Viewer capability создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceImportViewerAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: CAPTCHA state/solver lease не допускает выдачу.
    delete:
      tags: [Admin]
      summary: Revoke CAPTCHA viewer access
      operationId: revokePlaceImportViewerAccess
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/PlaceImportOperationId'
      responses:
        '204':
          description: Capability/session удалены, старый WebSocket закрывается.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Активный solver lease отсутствует.

