name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy admin to production
    runs-on:
      - self-hosted
      - Linux
      - X64
      - production
      - amazing-ekb-hub
      - admin

    environment: production

    env:
      APP_DIR: /opt/amazing-ekb-hub
      IMAGE_NAME: amazing-ekb-hub-admin
      ADMIN_BASE_URL: https://admin.strelchukgo.ru
      VITE_API_BASE_URL: https://api.strelchukgo.ru/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint:strict

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build application
        run: pnpm run build

      - name: Build runtime image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:prod" \
            .

      - name: Deploy admin
        run: |
          set -euo pipefail

          flock "${APP_DIR}/deploy.lock" bash <<'DEPLOY'
          set -euo pipefail

          cd "${APP_DIR}"
          docker compose --env-file .env -f compose.yml --profile apps up -d admin
          docker compose --env-file .env -f compose.yml ps admin
          DEPLOY

      - name: Smoke test admin
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS "${ADMIN_BASE_URL}/" >/dev/null \
              && curl -fsS "${ADMIN_BASE_URL}/__spa_smoke__" >/dev/null; then
              exit 0
            fi

            if [ "${attempt}" -eq 30 ]; then
              exit 1
            fi

            sleep 2
          done

      - name: Show admin logs on failure
        if: failure()
        run: |
          docker compose --env-file /opt/amazing-ekb-hub/.env \
            -f /opt/amazing-ekb-hub/compose.yml \
            logs --tail=150 admin || true
